# The only way into the ATS check's parsers. Tika and Affinda sit on a Docker network
# with no route out (`internal: true`): a CV sent to them cannot leave the machine, even
# if a parser tried. This gateway joins both networks and forwards the two ports, bound
# to 127.0.0.1 by docker-compose.yml. See docs/ats-check.md.

# A CV and its embedded photo stay well under this.
client_max_body_size 20m;

# Tika: the text a parsing pipeline reads first.
server {
    listen 9998;
    location / {
        proxy_pass http://tika:9998;
        proxy_read_timeout 120s;
    }
}

# Affinda: a commercial resume parser, run locally, emulated on Apple Silicon: slow.
server {
    listen 8080;
    location / {
        proxy_pass http://affinda:8080;
        proxy_read_timeout 300s;
    }
}
