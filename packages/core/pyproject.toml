[project]
name = "jobingo-core"
version = "0.1.0"
description = "Jobingo's domain, services and adapters"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9",
    "jinja2>=3.1.6",
    "pillow>=13.0.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pypdf>=6.21.4",
    "pyyaml>=6",
    "weasyprint>=70.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobingo"]
