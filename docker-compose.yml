# Local development database. The credentials are not secrets: the port is only
# reachable from this machine. The fixed name makes every worktree share this server.
# The data lives in the named volume and survives restarts and `make db-down`.
# Only `docker compose down -v` or removing the volume deletes it: never use them.
name: jobingo

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: jobingo
      POSTGRES_PASSWORD: jobingo
      POSTGRES_DB: jobingo
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jobingo']
      interval: 2s
      timeout: 3s
      retries: 15

  # Local mail for development and tests: a real SMTP and a real IMAP server, so the
  # mail code speaks the actual protocols with no mailbox of the user's involved.
  # Setting the Gmail values in .env points the app at Gmail instead.
  # Pinned by digest: Mailpit v1.27 and GreenMail 2.1.5, both from 2025.

  # Sending: keeps every message, shown at http://127.0.0.1:8025 and in its API.
  mailpit:
    image: axllent/mailpit@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

  # Reading: a fictional mailbox, empty at each start. Tests deliver to it over its
  # SMTP port, and the app reads it over IMAP like any mailbox. Any address logs in
  # with any password and gets its own mailbox, so each test has one to itself.
  greenmail:
    image: greenmail/standalone@sha256:8a2024725c7b1ce8f720644bccb6f237781992a8cbf283023446eb7d29326ad0
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=alex:jobingo@jobingo.test
        -Dgreenmail.users.login=email -Dgreenmail.auth.disabled
    ports:
      - '127.0.0.1:3025:3025'
      - '127.0.0.1:3143:3143'

  # The ATS check (docs/ats-check.md), off by default: `make ats-up`. Two parsers on a
  # network with no route out, so a CV sent to them stays on this machine, reached
  # through one gateway bound to 127.0.0.1. Pinned by digest: Tika 4.2.0 and Affinda's
  # resume parser, both from late October 2026, and nginx 1.29.

  # Text extraction, as a parsing pipeline's first step reads it.
  tika:
    profiles: [ats]
    image: apache/tika@sha256:b99f19c4fd76237dafe7d22f719b9bddfa9a449da687c597a41e2f6d9a595418
    networks: [ats-isolated]

  # A commercial resume parser run locally: the structured fields an ATS would see.
  # Proprietary, in evaluation mode without a licence (1 000 parses, counted in its
  # volume); a free trial licence goes in .env as AFFINDA_LICENSE_TOKEN. Built for x86
  # only: emulated on Apple Silicon, so slow.
  affinda:
    profiles: [ats]
    image: affinda/resume-parser@sha256:630b8475b40bbed50e061dadd92f3b35c891615b8f9d4b1637a6114d1d826543
    platform: linux/amd64
    environment:
      AFFINDA_LICENSE_TOKEN: ${AFFINDA_LICENSE_TOKEN:-}
    volumes:
      - affinda-data:/var/lib/affinda
    networks: [ats-isolated]

  ats-gateway:
    profiles: [ats]
    image: nginx@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    volumes:
      - ./docker/ats/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '127.0.0.1:9998:9998'
      - '127.0.0.1:8090:8080'
    networks: [default, ats-isolated]
    depends_on: [tika, affinda]

networks:
  ats-isolated:
    internal: true

volumes:
  postgres-data:
  affinda-data:
